openapi: 3.0.3

info:
  title: "# TODO: Nombre del servicio (ej: GRV Siniestros API)"
  description: |
    # TODO: Descripción del servicio.
    Qué dominio cubre, qué casos de uso expone, quién lo consume.
  version: "1.0.0"
  contact:
    name: "# TODO: Nombre del equipo owner"
    email: "# TODO: Email del equipo"

servers:
  - url: http://localhost:8080
    description: Dev local
  - url: "# TODO: https://api-dev.grv.internal/nombre-servicio"
    description: Dev compartido
  - url: "# TODO: https://api.grv.internal/nombre-servicio"
    description: Producción

# Política de seguridad — ajustar según el servicio
security:
  - bearerAuth: []

tags:
  - name: siniestros
    description: "# TODO: Operaciones sobre siniestros"
  - name: prestaciones
    description: "# TODO: Operaciones sobre prestaciones"

paths:

  # --- Ejemplo: listar recursos con paginación ---
  /v1/siniestros:
    get:
      tags: [siniestros]
      operationId: listarSiniestros
      summary: "# TODO: Listar siniestros"
      description: "# TODO: Descripción detallada del endpoint"
      parameters:
        - name: estado
          in: query
          required: false
          description: "# TODO: Valores posibles de estado"
          schema:
            type: string
            # TODO: agregar enum: [ACTIVO, CERRADO, PENDIENTE]
        - name: fecha_desde
          in: query
          required: false
          description: Filtrar siniestros desde esta fecha (inclusive). Formato ISO 8601.
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: fecha_hasta
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Lista paginada de siniestros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiniestroPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Ejemplo: obtener recurso por ID ---
  /v1/siniestros/{siniestroId}:
    get:
      tags: [siniestros]
      operationId: getSiniestro
      summary: "# TODO: Obtener siniestro por ID"
      parameters:
        - name: siniestroId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Siniestro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiniestroResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Ejemplo: crear recurso ---
  /v1/prestaciones:
    post:
      tags: [prestaciones]
      operationId: crearPrestacion
      summary: "# TODO: Crear prestación"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrestacionRequest'
      responses:
        '201':
          description: Prestación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Conflicto — la prestación ya existe para este siniestro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "# TODO: Confirmar si este servicio usa JWT o session-based auth"

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Número de página (base 0)
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Tamaño de la página

  schemas:

    # --- Schemas de dominio ---
    SiniestroResponse:
      type: object
      description: "# TODO: descripción del recurso Siniestro"
      required:
        - id
        - nroSiniestro
        - estado
        - fechaAccidente
        - tipoSiniestro
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        nroSiniestro:
          type: string
          description: Número de siniestro en formato AAAA/NNNNN
          example: "2024/00123"
        estado:
          type: string
          # TODO: agregar enum con los valores posibles
          example: "ACTIVO"
        fechaAccidente:
          type: string
          format: date
          example: "2024-01-15"
        fechaAlta:
          type: string
          format: date
          nullable: true
          example: "2024-02-10"
        tipoSiniestro:
          type: string
          enum: [AT, EP, IN_ITINERE]
          description: |
            AT = Accidente de trabajo
            EP = Enfermedad profesional
            IN_ITINERE = Accidente in itinere

    SiniestroPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SiniestroResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    PrestacionRequest:
      type: object
      required:
        - siniestroId
        - tipo
      properties:
        siniestroId:
          type: integer
          format: int64
        tipo:
          type: string
          # TODO: agregar enum con tipos de prestación
        monto:
          type: number
          format: double
          minimum: 0

    PrestacionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        siniestroId:
          type: integer
          format: int64
        tipo:
          type: string
        estado:
          type: string
        monto:
          type: number
          format: double

    ErrorResponse:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          example: "SINIESTRO_NO_ENCONTRADO"
        mensaje:
          type: string
          example: "No se encontró el siniestro con id 12345"
        detalles:
          type: array
          items:
            type: string
          description: Lista de errores de validación (solo en 400)
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Error de validación en el request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
